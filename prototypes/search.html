<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ежедневник — поиск</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #1c2a20;
    background:
      radial-gradient(1000px 600px at 8% 0%, #eef8ef 0%, transparent 60%),
      radial-gradient(900px 700px at 100% 100%, #d7ebde 0%, transparent 65%),
      linear-gradient(140deg, #e3f1e6, #f8fbf8);
    min-height: 100vh;
    padding: 22px clamp(14px, 3vw, 40px) 34px;
  }
  .page-head { max-width: 980px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 42px; height: 42px; border-radius: 12px; background: #2e7d5b; color: #fff; display: grid; place-items: center; font-size: 21px; box-shadow: 0 10px 22px rgba(46,125,91,.25); }
  .eyebrow { margin: 0 0 2px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #5f7161; font-weight: 800; }
  h1.page-title { margin: 0; font-size: clamp(18px, 2.2vw, 25px); letter-spacing: -.02em; }
  h1.page-title span { color: #2e7d5b; font-weight: 600; }
  .legend { font-size: 11px; color: #5f7161; background: rgba(255,255,255,.65); border: 1px solid rgba(46,61,47,.12); padding: 8px 11px; border-radius: 999px; }

  .window {
    --bg: #f5faf6; --panel: #fff; --panel-2: #edf6ef; --line: #dfece2;
    --text: #1c2a20; --muted: #637367; --primary: #2e7d5b; --primary-soft: #e0f1e5;
    --blue: #4a6d8c; --blue-soft: #e5eef6; --amber: #c98a2e; --amber-soft: #fdf3df;
    --red: #b8433c; --red-soft: #fbe9e7; --family: #c9656e;
    width: min(980px, 100%); height: min(800px, calc(100vh - 120px)); min-height: 620px;
    margin: 0 auto; border-radius: 18px; overflow: hidden; border: 1px solid #cbd8ce;
    background: var(--bg); color: var(--text);
    box-shadow: 0 30px 70px rgba(24,52,34,.18), 0 8px 20px rgba(24,52,34,.12);
    display: flex; flex-direction: column; position: relative;
  }
  .titlebar { height: 42px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
  .traffic { display: flex; gap: 6px; }
  .traffic i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .traffic i:nth-child(1) { background: #ff5f57; }
  .traffic i:nth-child(2) { background: #febc2e; }
  .traffic i:nth-child(3) { background: #28c840; }
  .window-title { font-size: 12px; font-weight: 650; color: var(--muted); margin-left: 6px; }
  .titlebar .spacer { flex: 1; }
  .local-pill { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 5px 9px; border-radius: 999px; }
  .local-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #35a36b; }

  .search-head { padding: 18px 20px 10px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .search-line { display: flex; align-items: center; gap: 9px; }
  .back { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; cursor: pointer; font-size: 16px; }
  .search-box { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--primary); border-radius: 11px; padding: 0 11px; height: 42px; box-shadow: 0 0 0 3px rgba(46,125,91,.09); }
  .search-box span { color: var(--muted); font-size: 15px; }
  .search-box input { flex: 1; border: 0; outline: none; background: transparent; color: var(--text); font: inherit; font-size: 14px; }
  .kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; font-size: 9px; color: var(--muted); background: var(--panel-2); white-space: nowrap; }
  .search-meta { display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 10px; color: var(--muted); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 20px 12px; border-bottom: 1px solid var(--line); align-items: center; }
  .filter { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; height: 28px; padding: 0 11px; font: inherit; font-size: 10.5px; cursor: pointer; }
  .filter.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .filter.blue.active { background: var(--blue); border-color: var(--blue); }
  .filter.amber.active { background: var(--amber); border-color: var(--amber); }

  .results { flex: 1; overflow-y: auto; padding: 14px 20px 28px; }
  .summary { font-size: 10px; color: var(--muted); margin: 0 0 10px; }
  .group-title { display: flex; align-items: center; gap: 8px; margin: 14px 0 7px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
  .group-title span { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 6px; font-size: 9px; letter-spacing: 0; }
  .result-card { display: flex; gap: 11px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; margin-bottom: 8px; cursor: pointer; }
  .result-card:hover { border-color: var(--primary); box-shadow: 0 3px 10px rgba(46,125,91,.08); }
  .result-icon { width: 34px; height: 34px; border-radius: 9px; flex: none; display: grid; place-items: center; font-size: 16px; background: var(--primary-soft); color: var(--primary); }
  .result-icon.task { background: var(--blue-soft); color: var(--blue); }
  .result-body { flex: 1; min-width: 0; }
  .result-body h3 { margin: 0 0 4px; font-size: 13px; line-height: 1.35; }
  .snippet { margin: 0 0 6px; font-size: 10.5px; line-height: 1.5; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  mark { background: #fff1b8; color: inherit; border-radius: 2px; padding: 0 1px; }
  .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 9.5px; color: var(--muted); }
  .tag { display: inline-flex; align-items: center; font-size: 9.5px; padding: 3px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
  .tag.green { background: var(--primary-soft); color: var(--primary); }
  .tag.blue { background: var(--blue-soft); color: var(--blue); }
  .tag.amber { background: var(--amber-soft); color: var(--amber); }
  .tag.family { background: #fbe9ec; color: var(--family); }
  .open { font-size: 15px; color: var(--muted); margin-left: 4px; align-self: center; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .big { font-size: 36px; margin-bottom: 10px; }
  .empty-state h3 { margin: 0 0 7px; color: var(--text); font-size: 15px; }
  .empty-state p { margin: 0 auto; max-width: 400px; font-size: 11px; line-height: 1.55; }
  .tips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .tips span { font-size: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; }

  .drawer-backdrop { position: absolute; inset: 0; background: rgba(20,34,25,.28); display: none; z-index: 8; }
  .drawer-backdrop.show { display: block; }
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--panel); border-left: 1px solid var(--line); z-index: 9; transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; }
  .drawer.show { transform: translateX(0); }
  .drawer-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 10px; }
  .drawer-head h3 { margin: 0; font-size: 16px; }
  .drawer-head small { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
  .drawer-head .spacer { flex: 1; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px 24px; }
  .drawer-body p { font-size: 11.5px; line-height: 1.65; color: var(--muted); }
  .drawer-actions { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  .drawer-actions .spacer { flex: 1; }
  .ghost-btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; height: 31px; padding: 0 10px; font: inherit; font-size: 10.5px; cursor: pointer; }
  .primary-btn { border: 0; background: var(--primary); color: #fff; border-radius: 9px; height: 33px; padding: 0 13px; font: inherit; font-size: 11.5px; font-weight: 650; cursor: pointer; }
  .toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(12px); background: #1c2a20; color: #fff; font-size: 11px; padding: 8px 13px; border-radius: 9px; opacity: 0; pointer-events: none; transition: .18s ease; z-index: 20; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    body { padding: 10px 8px 18px; }
    .legend { display: none; }
    .window { height: calc(100vh - 70px); min-height: 560px; border-radius: 14px; }
    .search-head { padding: 12px 14px 8px; }
    .filters { padding: 8px 14px 10px; }
    .results { padding: 12px 14px 22px; }
    .kbd { display: none; }
    .drawer { width: 100%; }
  }
</style>
</head>
<body>
<header class="page-head">
  <div class="brand">
    <div class="brand-mark">⌕</div>
    <div>
      <p class="eyebrow">Ежедневник · этап 10</p>
      <h1 class="page-title">Локальный <span>поиск</span></h1>
    </div>
  </div>
  <div class="legend">Прототип · заметки и задачи · без сети</div>
</header>

<main class="window">
  <div class="titlebar">
    <div class="traffic"><i></i><i></i><i></i></div>
    <div class="window-title">Поиск — Ежедневник</div>
    <div class="spacer"></div>
    <div class="local-pill"><span class="dot"></span> Локальные данные</div>
  </div>

  <section class="search-head">
    <div class="search-line">
      <button class="back" title="Назад">←</button>
      <div class="search-box">
        <span>⌕</span>
        <input id="query" value="план" placeholder="Заметки, задачи, дорожки…" autocomplete="off">
        <span class="kbd">⌘K</span>
      </div>
    </div>
    <div class="search-meta">Ищет по заголовкам, тексту заметок, описанию задач, дорожкам и категориям.</div>
  </section>

  <section class="filters">
    <button class="filter active" data-type="all">Все</button>
    <button class="filter" data-type="note">Заметки</button>
    <button class="filter" data-type="task">Задачи</button>
    <span style="width:1px;height:18px;background:var(--line);margin:0 3px"></span>
    <button class="filter blue active" data-category="all">Все категории</button>
    <button class="filter" data-category="work">Работа</button>
    <button class="filter" data-category="personal">Личное</button>
    <button class="filter" data-category="family">Семья</button>
    <button class="filter amber" id="highFilter">Высокий приоритет</button>
  </section>

  <section class="results" id="results">
    <p class="summary" id="summary">5 результатов · локально</p>
    <div id="resultList"></div>
  </section>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <h3 id="drawerTitle">Заметка</h3>
        <small id="drawerSub">Найдено в заголовке</small>
      </div>
      <div class="spacer"></div>
      <button class="ghost-btn" id="closeDrawer">Закрыть</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-actions">
      <span class="spacer"></span>
      <button class="ghost-btn" id="cancelDrawer">Отмена</button>
      <button class="primary-btn" id="openResult">Открыть</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>
</main>

<script>
(() => {
  const categories = {
    work: { label:'Работа', cls:'green' },
    personal: { label:'Личное', cls:'blue' },
    family: { label:'Семья', cls:'family' },
  };
  const notes = [
    { id:'n1', title:'Планы на неделю', content:'Собрать план на неделю и сверить с командой. Подготовить план встречи, согласовать сроки с поставщиком.', category:'work', updated:'сегодня, 12:40' },
    { id:'n2', title:'Идеи для проекта', content:'Новый план запуска: исследование, прототип, обратная связь. Добавить в план следующей недели.', category:'work', updated:'вчера, 18:20' },
    { id:'n3', title:'Список покупок', content:'Молоко, хлеб, подарок. Не забыть про день рождения в субботу.', category:'personal', updated:'3 ноября' },
  ];
  const tasks = [
    { id:'t1', title:'Подготовить план встречи', description:'Собрать план, участников и вопросы для обсуждения.', category:'work', lane:'В работе', priority:'HIGH', reminder:'сегодня, 14:00', updated:'сегодня' },
    { id:'t2', title:'Согласовать бюджет', description:'Проверить план расходов и подписать документы.', category:'work', lane:'В работе', priority:'NORMAL', reminder:null, updated:'вчера' },
    { id:'t3', title:'Позвонить поставщику', description:'Уточнить сроки и стоимость доставки.', category:'personal', lane:'Новые', priority:'HIGH', reminder:'завтра, 15:30', updated:'сегодня' },
    { id:'t4', title:'Собрать требования', description:'Подготовить список требований к новому плану.', category:'work', lane:'Новые', priority:'NORMAL', reminder:null, updated:'5 ноября' },
    { id:'t5', title:'Купить подарок', description:'День рождения в субботу.', category:'family', lane:'Готово', priority:'NORMAL', reminder:null, updated:'вчера' },
  ];

  let type = 'all';
  let category = 'all';
  let highOnly = false;
  let selected = null;
  const toast = document.getElementById('toast');

  function notify(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(notify.timer);
    notify.timer = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  function escapeHtml(value) {
    return value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function highlight(value, query) {
    if (!query) return escapeHtml(value);
    const source = escapeHtml(value);
    const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return source.replace(new RegExp(q, 'gi'), (match) => `<mark>${match}</mark>`);
  }
  function matches(value, query) {
    return value.toLocaleLowerCase('ru').includes(query.toLocaleLowerCase('ru'));
  }

  function render() {
    const query = document.getElementById('query').value.trim();
    const list = document.getElementById('resultList');
    const summary = document.getElementById('summary');
    if (!query) {
      summary.textContent = '';
      list.innerHTML = `<div class="empty-state"><div class="big">⌕</div><h3>Начните вводить запрос</h3><p>Поиск работает по локальной базе без сети: заметки, задачи, дорожки, категории и напоминания.</p><div class="tips"><span>план</span><span>Работа</span><span>встреча</span><span>напоминание</span></div></div>`;
      return;
    }

    const noteResults = type !== 'task' ? notes.filter(n => {
      if (category !== 'all' && n.category !== category) return false;
      if (highOnly) return false;
      return matches(n.title, query) || matches(n.content, query) || matches(categories[n.category].label, query);
    }) : [];
    const taskResults = type !== 'note' ? tasks.filter(t => {
      if (category !== 'all' && t.category !== category) return false;
      if (highOnly && t.priority !== 'HIGH') return false;
      return matches(t.title, query) || matches(t.description, query) || matches(t.lane, query) || matches(categories[t.category].label, query);
    }) : [];

    const total = noteResults.length + taskResults.length;
    summary.textContent = `${total} результатов · локально`;
    list.innerHTML = '';

    if (!total) {
      summary.textContent = '0 результатов · локально';
      list.innerHTML = `<div class="empty-state"><div class="big">∅</div><h3>Ничего не найдено</h3><p>Попробуйте изменить запрос или снять фильтры. Поиск не учитывает регистр.</p></div>`;
      return;
    }

    if (noteResults.length) {
      list.insertAdjacentHTML('beforeend', `<div class="group-title">Заметки <span>${noteResults.length}</span></div>`);
      noteResults.forEach(note => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `<div class="result-icon">✎</div><div class="result-body"><h3>${highlight(note.title, query)}</h3><p class="snippet">${highlight(note.content, query)}</p><div class="meta"><span class="tag ${categories[note.category].cls}">${categories[note.category].label}</span><span>${note.updated}</span><span class="tag">Заметка</span></div></div><div class="open">›</div>`;
        card.addEventListener('click', () => openResult('note', note));
        list.appendChild(card);
      });
    }

    if (taskResults.length) {
      list.insertAdjacentHTML('beforeend', `<div class="group-title">Задачи <span>${taskResults.length}</span></div>`);
      taskResults.forEach(task => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `<div class="result-icon task">▦</div><div class="result-body"><h3>${highlight(task.title, query)}</h3><p class="snippet">${highlight(task.description, query)}</p><div class="meta"><span class="tag ${categories[task.category].cls}">${categories[task.category].label}</span><span class="tag">${task.lane}</span>${task.priority === 'HIGH' ? '<span class="tag" style="color:var(--red);background:var(--red-soft)">Высокий</span>' : ''}${task.reminder ? `<span class="tag amber">🔔 ${task.reminder}</span>` : ''}<span>${task.updated}</span></div></div><div class="open">›</div>`;
        card.addEventListener('click', () => openResult('task', task));
        list.appendChild(card);
      });
    }
  }

  function openResult(kind, item) {
    selected = { kind, item };
    document.getElementById('drawerTitle').textContent = item.title;
    document.getElementById('drawerSub').textContent = kind === 'note' ? 'Заметка · открыть редактор' : `Задача · ${item.lane}`;
    const body = kind === 'note'
      ? `<div class="meta"><span class="tag ${categories[item.category].cls}">${categories[item.category].label}</span><span>${item.updated}</span></div><p>${escapeHtml(item.content)}</p><div class="tag">Markdown</div>`
      : `<div class="meta"><span class="tag ${categories[item.category].cls}">${categories[item.category].label}</span><span class="tag">${item.lane}</span>${item.reminder ? '<span class="tag amber">🔔 ' + item.reminder + '</span>' : ''}</div><p>${escapeHtml(item.description)}</p><div class="tag">Задача</div>`;
    document.getElementById('drawerBody').innerHTML = body;
    document.getElementById('drawer').classList.add('show');
    document.getElementById('drawerBackdrop').classList.add('show');
  }

  function closeDrawer() {
    selected = null;
    document.getElementById('drawer').classList.remove('show');
    document.getElementById('drawerBackdrop').classList.remove('show');
  }

  document.getElementById('query').addEventListener('input', render);
  document.querySelectorAll('[data-type]').forEach(button => {
    button.addEventListener('click', () => {
      type = button.dataset.type;
      document.querySelectorAll('[data-type]').forEach(item => item.classList.toggle('active', item === button));
      render();
    });
  });
  document.querySelectorAll('[data-category]').forEach(button => {
    button.addEventListener('click', () => {
      category = button.dataset.category;
      document.querySelectorAll('[data-category]').forEach(item => item.classList.toggle('active', item === button));
      render();
    });
  });
  document.getElementById('highFilter').addEventListener('click', (event) => {
    highOnly = !highOnly;
    event.currentTarget.classList.toggle('active', highOnly);
    render();
  });
  document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
  document.getElementById('cancelDrawer').addEventListener('click', closeDrawer);
  document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
  document.getElementById('openResult').addEventListener('click', () => {
    if (!selected) return;
    notify(selected.kind === 'note' ? 'Открывается редактор заметки' : 'Открывается редактор задачи');
    closeDrawer();
  });
  document.querySelector('.back').addEventListener('click', () => notify('Возврат к списку'));

  render();
})();
</script>
</body>
</html>
