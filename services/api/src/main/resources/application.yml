spring:
  application:
    name: zadachnik-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/zadachnik}
    username: ${DATABASE_USER:zadachnik}
    password: ${DATABASE_PASSWORD:zadachnik}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  security:
    setup-token: ${SETUP_TOKEN:}
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:zadachnik-api}
      audience: ${JWT_AUDIENCE:zadachnik-client}
      access-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-ttl: ${JWT_REFRESH_TTL:30d}
