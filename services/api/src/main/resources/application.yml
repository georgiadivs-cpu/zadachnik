spring:
  application:
    name: zadachnik-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/zadachnik}
    username: ${DATABASE_USER:zadachnik}
    password: ${DATABASE_PASSWORD:zadachnik}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 300MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  attachments:
    dir: ${ATTACHMENTS_DIR:./data/attachments}
    max-bytes: ${ATTACHMENTS_MAX_BYTES:26214400}
  backups:
    dir: ${BACKUP_DIR:./data/backups}
    age-binary: ${BACKUP_AGE_BINARY:age}
    age-keygen-binary: ${BACKUP_AGE_KEYGEN_BINARY:age-keygen}
    age-identity: ${BACKUP_AGE_IDENTITY:}
    age-recipient: ${BACKUP_AGE_RECIPIENT:}
    pg-dump: ${BACKUP_PG_DUMP:pg_dump}
    pg-restore: ${BACKUP_PG_RESTORE:pg_restore}
    device-snapshot-max-bytes: ${BACKUP_DEVICE_MAX_BYTES:268435456}
    min-free-bytes: ${BACKUP_MIN_FREE_BYTES:10737418240}
    retention-recent: ${BACKUP_RETENTION_RECENT:7}
    retention-weekly: ${BACKUP_RETENTION_WEEKLY:4}
    retention-monthly: ${BACKUP_RETENTION_MONTHLY:6}
    device-retention: ${BACKUP_DEVICE_RETENTION:3}
    process-timeout: ${BACKUP_PROCESS_TIMEOUT:30m}
  security:
    setup-token: ${SETUP_TOKEN:}
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:zadachnik-api}
      audience: ${JWT_AUDIENCE:zadachnik-client}
      access-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-ttl: ${JWT_REFRESH_TTL:30d}
