openapi: 3.0.3
info:
  title: Zadachnik Sync API
  version: 0.1.0
  description: |
    API персонального «Ежедневника». Единственный путь записи
    пользовательских данных — POST /sync/push. Чтение изменений —
    GET /sync/pull по курсору.

servers:
  - url: http://localhost:8080/api/v1
    description: Локальная разработка

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Первый владелец и сессии устройств
  - name: devices
    description: Устройства владельца
  - name: sync
    description: Push и pull синхронизации

paths:
  /auth/setup:
    post:
      tags: [auth]
      summary: Создать первого владельца
      description: Доступно только при отсутствии пользователей в БД.
      security: []
      parameters:
        - name: X-Setup-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: Владелец создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [auth]
      summary: Вход устройства
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Ротировать refresh-токен
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      summary: Завершить сессию устройства
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Сессия завершена

  /devices:
    get:
      tags: [devices]
      summary: Список устройств
      responses:
        '200':
          description: Устройства владельца
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices/{deviceId}:
    delete:
      tags: [devices]
      summary: Отозвать устройство
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Устройство отозвано
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sync/state:
    get:
      tags: [sync]
      summary: Состояние синхронизации
      responses:
        '200':
          description: Текущее состояние сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncState'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync/push:
    post:
      tags: [sync]
      summary: Отправить пакет операций
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: Результат по каждой операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

  /sync/pull:
    get:
      tags: [sync]
      summary: Получить изменения после курсора
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            default: '0'
          description: Непрозрачный курсор; начальное значение 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Страница изменений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Требуется аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Доступ запрещён
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Слишком большой пакет
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            requestId:
              type: string
              nullable: true
            details:
              type: object
              additionalProperties: true
              nullable: true

    DeviceRequest:
      type: object
      required: [id, name, platform]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        platform:
          type: string
          enum: [ANDROID, IOS, MACOS, WINDOWS]

    AuthRequest:
      type: object
      required: [email, password, device]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device:
          $ref: '#/components/schemas/DeviceRequest'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      required:
        [userId, deviceId, accessToken, accessExpiresAt, refreshToken, refreshExpiresAt]
      properties:
        userId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time

    Device:
      type: object
      required: [id, name, platform, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
          enum: [ANDROID, IOS, MACOS, WINDOWS]
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true

    SyncState:
      type: object
      required: [protocolVersion, serverTime, latestChangeSeq, deviceId]
      properties:
        protocolVersion:
          type: integer
          example: 1
        serverTime:
          type: string
          format: date-time
        latestChangeSeq:
          type: integer
          format: int64
        deviceId:
          type: string
          format: uuid

    SyncOperation:
      type: object
      required:
        [operationId, deviceId, entityType, entityId, operationType, clientTimestamp]
      properties:
        operationId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        entityType:
          type: string
          enum:
            [NOTE, TASK, LANE, CATEGORY, NOTE_LINK, TASK_NOTE_LINK, ATTACHMENT, REMINDER]
        entityId:
          type: string
          format: uuid
        operationType:
          type: string
          enum: [CREATE, UPDATE, DELETE]
        baseRevision:
          type: integer
          format: int64
          nullable: true
        clientTimestamp:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          nullable: true

    PushRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncOperation'

    PushResult:
      type: object
      required: [operationId, status]
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [APPLIED, DUPLICATE, CONFLICT, REJECTED]
        entityId:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
        changeSeq:
          type: integer
          format: int64
        serverEntity:
          type: object
          additionalProperties: true
          nullable: true
        code:
          type: string
        message:
          type: string

    PushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PushResult'

    Change:
      type: object
      required:
        [seq, entityType, entityId, operationType, revision, changedAt]
      properties:
        seq:
          type: integer
          format: int64
        entityType:
          type: string
          enum:
            [NOTE, TASK, LANE, CATEGORY, NOTE_LINK, TASK_NOTE_LINK, ATTACHMENT, REMINDER]
        entityId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
          nullable: true
        operationType:
          type: string
          enum: [CREATE, UPDATE, DELETE]
        revision:
          type: integer
          format: int64
        originDeviceId:
          type: string
          format: uuid
          nullable: true
        changedAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true

    PullResponse:
      type: object
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Change'
        nextCursor:
          type: string
        hasMore:
          type: boolean
